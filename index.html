<style id="css">
:root{--bg:#E8ECEF;--grid:rgba(20,38,61,.07);--ink:#14263D;--ink2:#4A5D73;--card:#FBFCFD;--line:#8395AA;--amber:#B86E0E;--amber-bg:#FCF1DF;--closed:#8A96A4;--panel:#FFFFFF;--hair:rgba(20,38,61,.16);--focus:#2F6FB3;--land:#F7F8F9;--mil:#56704F;--sec:#6A4BA6;--sec-bg:#F1ECFA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1620;--grid:rgba(220,229,239,.05);--ink:#DDE6EF;--ink2:#9AABBE;--card:#15212E;--line:#50647A;--amber:#E9A443;--amber-bg:#2A2010;--closed:#6D7B8A;--panel:#132030;--hair:rgba(220,229,239,.14);--focus:#7FB0E6;--land:#16222F;--mil:#8BA883;--sec:#B49BE3;--sec-bg:#231B35}}
:root[data-theme="dark"]{--bg:#0D1620;--grid:rgba(220,229,239,.05);--ink:#DDE6EF;--ink2:#9AABBE;--card:#15212E;--line:#50647A;--amber:#E9A443;--amber-bg:#2A2010;--closed:#6D7B8A;--panel:#132030;--hair:rgba(220,229,239,.14);--focus:#7FB0E6;--land:#16222F;--mil:#8BA883;--sec:#B49BE3;--sec-bg:#231B35}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--hair);background:var(--bg);position:relative;z-index:3}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:21px;letter-spacing:.01em;margin:0 auto 0 0;line-height:1.15}
.tools{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--line)}
button:focus-visible,textarea:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--ink)}
.sq{width:36px;padding:0;font-size:18px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.lin{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.node{position:absolute;width:210px;min-height:78px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px 10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.node:hover{border-color:var(--ink2)}
.node .t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;line-height:1.1;margin:0}
.node .s{font-size:13px;color:var(--ink2);margin:3px 0 0;line-height:1.3}
.node.active{border-color:var(--amber);border-width:2.5px;background:var(--amber-bg)}
.node.closed{border-style:dashed;border-color:var(--closed)}
.node.closed .t{color:var(--ink2)}
.node.root{background:var(--ink);border-color:var(--ink)}
.node.root .t,.node.root .s{color:var(--bg)}
.node.custom{border-style:dotted;border-width:2px}
.node.sel{box-shadow:0 0 0 3px var(--focus)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:5px;z-index:2;pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend span[hidden]{display:none}
.sw{width:22px;height:13px;border-radius:3px;border:1.5px solid var(--line);background:var(--card)}
.sw.a{border:2.5px solid var(--amber);background:var(--amber-bg)}
.sw.c{border-style:dashed;border-color:var(--closed)}
.sw.l{border:0;height:0;border-top:2px dashed var(--amber);border-radius:0;background:none}
.hint{position:absolute;right:12px;bottom:12px;font-size:12.5px;color:var(--ink2);z-index:2;pointer-events:none;text-align:right;max-width:46%}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--hair);z-index:4;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
#panel.open{transform:none}
@media (max-width:640px){#panel{top:auto;left:0;width:100%;height:68%;border-left:0;border-top:1px solid var(--hair);border-radius:14px 14px 0 0;transform:translateY(105%)}.hint{display:none}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.ph{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hair)}
.ph h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:24px;line-height:1.1;margin:0}
.ph p{margin:3px 0 0;color:var(--ink2);font-size:14px}
.pb{padding:14px 16px 20px;overflow-y:auto;flex:1}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--hair);color:var(--ink2);margin-bottom:10px}
.pill.a{background:var(--amber-bg);border-color:var(--amber);color:var(--ink)}
.facts{margin:0 0 18px;max-width:62ch}
.facts p{margin:0 0 10px}
h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:17px;margin:18px 0 6px}
textarea,input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:8px 10px}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:13px;color:var(--ink2)}
.danger{color:#B3261E}
.err{font-size:13px;color:#B3261E;margin-top:4px;min-height:1em}

.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px;background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font-size:13px;padding:4px 10px;min-height:32px;border-radius:16px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink)}
#world,#mapw,#tlw{transition:opacity 2.4s ease-in-out,visibility 0s linear 0s}
body:not(.mode-tree) #world,body:not(.mode-map) #mapw,body:not(.mode-timeline) #tlw{opacity:0;visibility:hidden;pointer-events:none;transition:opacity 2.4s ease-in-out,visibility 0s linear 2.4s}
.node,.node .t,.node .s{transition:background-color 2.4s ease-in-out,color 2.4s ease-in-out,border-color 2.4s ease-in-out}
.e{transition:stroke 2.4s ease-in-out}
body,header,#vp,.legend,#panel,button,textarea,input,.pill,.pin .lb{transition:background-color 2.4s ease-in-out,color 2.4s ease-in-out,border-color 2.4s ease-in-out}

.mode-map h1{text-shadow:0 0 8px rgba(0,255,65,.55)}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2.4s ease-in-out}
.mode-map #rain{opacity:.22}
.mode-map .land{fill:rgba(0,255,65,.035);stroke-width:1.4}
.mode-map #mapw svg{filter:drop-shadow(0 0 3px rgba(0,255,65,.7))}
.mode-map .pin.uap .mk{box-shadow:0 0 8px 2px rgba(0,255,65,.8);border-color:#000}
.mode-map .pin.gov .mk{background:#000;border:2px solid #00FF41}
.mode-map .pin.mil .mk{border-color:#000}
.mode-map .pin.mil.u .mk{box-shadow:0 0 0 2px #00FF41,0 0 8px 2px rgba(0,255,65,.6)}
.mode-map .pin.mine .mk{background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7)}
.mode-map .lg-gov{background:#000;border:2px solid #00FF41}
.mode-map .lg-uap{box-shadow:0 0 6px 1px rgba(0,255,65,.8)}
.mode-map .lg-milu{box-shadow:0 0 0 2px #00FF41}
.mode-map .lg-mine{background:#fff}
.mode-map .pin .lb{background:#000;color:#00FF41;border-color:rgba(0,255,65,.5)}
.mode-map .danger{color:#FF6B6B}

#mapw{position:absolute;left:0;top:0;transform-origin:0 0;width:975px;height:610px}

.land{fill:var(--land);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}

.pin{position:absolute;width:0;height:0;cursor:pointer}
.pin .pk{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;transform-origin:0 0}
.pin .pk{transform:scale(calc(1 / var(--k,1))) translate(-50%,-50%)}

.pin.gov .mk{background:var(--ink);border-radius:2px}
.pin.mil .mk{background:var(--mil);border-radius:50%;width:11px;height:11px}
.pin.mil.u .mk{box-shadow:0 0 0 2px var(--amber)}
.pin.uap .mk{background:var(--amber);transform:rotate(45deg);width:12px;height:12px}
.pin.mine .mk{background:var(--focus);border-radius:50%;width:13px;height:13px;box-shadow:0 0 0 2px var(--card)}
.pin.sel .mk{outline:3px solid var(--focus);outline-offset:2px}
.pin .lb{position:absolute;left:12px;top:-8px;white-space:nowrap;font-size:12px;line-height:1.2;color:var(--ink);background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--hair);display:none;pointer-events:none}
.labels .pin .lb,.pin.sel .lb{display:block}
.pin:focus-visible{outline:none}.pin:focus-visible .mk{outline:2px solid var(--focus);outline-offset:3px}
#vp.placing{cursor:crosshair}
.lg-gov{width:12px;height:12px;background:var(--ink);border-radius:2px}
.lg-mil{width:11px;height:11px;background:var(--mil);border-radius:50%}
.lg-milu{width:11px;height:11px;background:var(--mil);border-radius:50%;box-shadow:0 0 0 2px var(--amber)}
.lg-uap{width:11px;height:11px;background:var(--amber);transform:rotate(45deg);margin:0 1px}
.lg-mine{width:12px;height:12px;background:var(--focus);border-radius:50%}
.node.secret{border-color:var(--sec);border-width:2px;background:var(--sec-bg)}
.node.secret .t{color:var(--ink)}
.sw.s{border:2px solid var(--sec);background:var(--sec-bg)}
.pill.vv{border-color:var(--sec);color:var(--ink)}
.pin.sec .mk{background:var(--sec);width:14px;height:13px;border:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.lg-sec{width:13px;height:12px;background:var(--sec);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mode-map .pin.sec .mk,.mode-map .lg-sec{background:#7DFFA0}
.golinks{margin:0 0 12px}
.golinks button{font-size:13px;min-height:32px;padding:4px 10px}
#tlw{position:absolute;left:0;top:0;transform-origin:0 0}
#tlsvg{position:absolute;left:0;top:0;overflow:visible}
.tg{stroke:var(--hair);stroke-width:1}.tg.td{stroke:var(--line);stroke-opacity:.45}
.tt{stroke:var(--line);stroke-width:1}.tax{stroke:var(--ink2);stroke-width:1.5}
.tnow{stroke:var(--amber);stroke-width:2;stroke-dasharray:4 4}
.tly{position:absolute;top:36px;transform:translateX(-50%);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:16px;color:var(--ink2)}
.tly.dec{font-weight:600;font-size:20px;top:32px;color:var(--ink)}
.tly.now{color:var(--amber);font-weight:600;top:16px}
.tlsec{position:absolute;left:14px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;color:var(--ink2)}
.tlb{position:absolute;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;min-width:10px}
.tlb.active{border:2.5px solid var(--amber);background:var(--amber-bg)}
.tlb.closed{border-style:dashed;border-color:var(--closed)}
.tlb.secret{border:2px solid var(--sec);background:var(--sec-bg)}
.tlb.on{border-right-style:dashed}
.tlb .bl{position:absolute;left:8px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:16px;color:var(--ink);pointer-events:none}
.tlb .bl.out{left:calc(100% + 8px)}
.tle{position:absolute;height:30px;display:flex;align-items:center;gap:7px;padding:0 10px 0 8px;white-space:nowrap;border:1px solid var(--hair);border-radius:15px;background:var(--card);font-size:14px;color:var(--ink);cursor:pointer}
.tle b{font-weight:500;color:var(--ink2)}
.tle .tm{display:block;width:11px;height:11px;flex:none;background:var(--amber);transform:rotate(45deg)}
.tle.sec .tm{background:var(--sec);transform:none;clip-path:polygon(50% 0,100% 100%,0 100%);width:12px}
.tle.mil .tm{background:var(--mil);border-radius:50%;transform:none;box-shadow:0 0 0 2px var(--amber)}
.tle.gov .tm{background:var(--ink);transform:none;border-radius:2px}
.tle .tdot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.tlb:hover,.tle:hover{border-color:var(--ink2)}
.tlb.sel,.tle.sel{box-shadow:0 0 0 3px var(--focus)}
.tlb:focus-visible,.tle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
</style>

{id:"aaro",p:"depsec",t:"AARO",s:"All-domain Anomaly Resolution Office",k:"active",st:"Active, 2022 to now",d:["Created in July 2022 as the successor to AOIMSG, and written into law by the FY2023 NDAA. Investigates UAP in the air, at sea, in space, and on land, and reviews the government's historical UAP record.","Its March 2024 Historical Record Report (Volume 1) found no evidence that any government investigation had confirmed extraterrestrial technology, or of hidden reverse-engineering programs.","First director: physicist Sean Kirkpatrick (2022 to 2023). Current director: Jon T. Kosloski. AARO works jointly with ODNI on intelligence reporting."]},

  for(var y=TL_START;y<=TL_END;y++){var x=yx(y);if(y%5===0){g+='<line x1="'+x+'" y1="70" x2="'+x+'" y2="'+tlBounds.h+'" class="tg'+(y%10===0?' td':'')+'"/>';h+='<div class="tly'+(y%10===0?' dec':'')+'" style="left:'+x+'px">'+y+'</div>';}
    else g+='<line x1="'+x+'" y1="62" x2="'+x+'" y2="70" class="tt"/>';}
  var nx=yx(NOWY);g+='<line x1="'+nx+'" y1="56" x2="'+nx+'" y2="'+tlBounds.h+'" class="tnow"/>';h+='<div class="tly now" style="left:'+nx+'px">Now</div>';
  g+='<line x1="'+yx(TL_START)+'" y1="70" x2="'+yx(TL_END)+'" y2="70" class="tax"/>';
  h+='<div class="tlsec" style="top:'+(tlBounds.by-30)+'px">Programs</div><div class="tlsec" style="top:'+(tlBounds.ey-30)+'px">Events and milestones</div>';
  TL.forEach(function(e){var p=tlPos[e.id];if(!p)return;
    if(e.type==="bar"){var inside=p.w>=tw(e.t)-10;
      h+='<div class="tlb '+e.kind+(e.ongoing?' on':'')+(e.id===selId?' sel':'')+'" data-id="'+e.id+'" tabindex="0" role="button" aria-label="'+esc(e.t+", "+e.y1+(e.y2!==e.y1?" to "+(e.ongoing?"now":e.y2):""))+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+p.w+'px"><span class="bl'+(inside?'':' out')+'">'+esc(e.t)+'</span></div>';}
    else{h+='<div class="tle '+e.kind+(e.id===selId?' sel':'')+'" data-id="'+e.id+'" tabindex="0" role="button" aria-label="'+esc(p.lab)+'" style="left:'+p.x+'px;top:'+p.y+'px"><i class="tm"></i><b>'+e.yr+'</b> '+esc(e.t)+(state.notes[e.own?e.id:(e.pid||e.tid)]?'<i class="tdot"></i>':'')+'</div>';}
  });
  var tlw=document.getElementById("tlw");tlw.style.width=tlBounds.w+"px";tlw.style.height=tlBounds.h+"px";
  document.getElementById("tlsvg").setAttribute("width",tlBounds.w);document.getElementById("tlsvg").setAttribute("height",tlBounds.h);
  document.getElementById("tlsvg").innerHTML=g;document.getElementById("tlitems").innerHTML=h;
}
var pos={},bounds={w:0,h:0},showLin=false,selId=null,mode="tree",placing=false;
var views={tree:null,map:null},tx=0,ty=0,k=1;
var filt={gov:true,mil:true,uap:true,sec:true,mine:true};
var HINTS={tree:"Drag to pan, pinch or scroll to zoom. Tap any box for details and notes.",map:"Pins mark major installations and notable cases, not every site. Zoom in to see names.",timeline:"Drag sideways to travel through time. Tap any bar or event for details and links to the tree and map."};

function treeAll(){return BASE.concat(state.custom.map(function(c){return {id:c.id,p:c.p,t:c.t,s:c.s||"",k:"custom",d:[],custom:"tree"}}))}
function pinAll(){return MAP.pins.concat(state.pins.map(function(p){return {id:p.id,c:"mine",t:p.t,s:p.s||"",x:p.x,y:p.y,d:[],custom:"pin"}}))}
function findItem(id){return treeAll().find(function(x){return x.id===id})||pinAll().find(function(x){return x.id===id})}
function kids(list,id){return list.filter(function(n){return n.p===id})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function renderTree(){
  var list=treeAll(),nx=PAD,heights={};
  world.querySelectorAll(".node").forEach(function(e){e.remove()});
  list.forEach(function(n){
    var el=document.createElement("div");
    el.className="node"+(n.k?" "+n.k:"")+(n.id===selId?" sel":"");
    el.dataset.id=n.id;el.tabIndex=0;el.setAttribute("role","button");
    el.setAttribute("aria-label",n.t+(n.s?", "+n.s:""));
    el.innerHTML='<p class="t">'+esc(n.t)+'</p>'+(n.s?'<p class="s">'+esc(n.s)+'</p>':'')+(state.notes[n.id]?'<i class="dot" title="Has your notes"></i>':'');
    world.appendChild(el);heights[n.id]=el.offsetHeight||78;
  });
  var depthH={};
  (function md(id,d){depthH[d]=Math.max(depthH[d]||0,heights[id]);kids(list,id).forEach(function(c){md(c.id,d+1)})})("gov",0);
  var depthY={0:PAD};for(var d=1;depthH[d];d++)depthY[d]=depthY[d-1]+depthH[d-1]+VGAP;
  pos={};
  (function lay(id,d){
    var ch=kids(list,id);
    if(!ch.length){pos[id]={x:nx,y:depthY[d],d:d};nx+=W+GAP;}
    else{ch.forEach(function(c){lay(c.id,d+1)});pos[id]={x:(pos[ch[0].id].x+pos[ch[ch.length-1].id].x)/2,y:depthY[d],d:d};}
  })("gov",0);
  var maxD=0;for(var q in pos)maxD=Math.max(maxD,pos[q].d);
  bounds={w:nx-GAP+PAD,h:depthY[maxD]+depthH[maxD]+PAD};
  world.querySelectorAll(".node").forEach(function(el){var p=pos[el.dataset.id];if(!p){el.remove();return;}el.style.left=p.x+"px";el.style.top=p.y+"px";});
  svg.setAttribute("width",bounds.w);svg.setAttribute("height",bounds.h);
  var paths="";
  list.forEach(function(n){if(!n.p||!pos[n.p]||!pos[n.id])return;var a=pos[n.p],b=pos[n.id];
    var x1=a.x+W/2,y1=a.y+heights[n.p],x2=b.x+W/2,y2=b.y,my=y1+VGAP/2;
    paths+='<path class="e" d="M'+x1+' '+y1+'V'+my+'H'+x2+'V'+y2+'"/>';});
  if(showLin){for(var i=0;i<LINEAGE.length-1;i++){var A=pos[LINEAGE[i]],B=pos[LINEAGE[i+1]];if(!A||!B)continue;
    var ax=A.x+W/2,ay=A.y+heights[LINEAGE[i]],bx=B.x+W/2,by=B.y+heights[LINEAGE[i+1]];
    var low=Math.max(ay,by)+34+i*6;
    paths+='<path class="lin" d="M'+ax+' '+ay+'C'+ax+' '+low+' '+bx+' '+low+' '+bx+' '+by+'"/>';}}
  svg.innerHTML=paths;
}
function visible(p){if(p.c==="mil")return filt.mil||(filt.uap&&p.u);return filt[p.c];}
function renderMap(){
  var h="";
  pinAll().forEach(function(p){if(!visible(p))return;
    h+='<div class="pin '+p.c+(p.u?' u':'')+(p.id===selId?' sel':'')+'" data-id="'+p.id+'" tabindex="0" role="button" aria-label="'+esc(p.t+", "+p.s)+'" style="left:'+p.x+'px;top:'+p.y+'px"><span class="pk"><i class="mk"></i><span class="lb">'+esc(p.t)+'</span></span></div>';});
  pinsEl.innerHTML=h;
}
function render(){if(mode==="tree")renderTree();else if(mode==="map")renderMap();else renderTimeline();}

function apply(){var el={tree:world,map:mapw,timeline:document.getElementById("tlw")}[mode];el.style.transform="translate("+tx+"px,"+ty+"px) scale("+k+")";
  mapw.style.setProperty("--k",k);mapw.classList.toggle("labels",k>=2.6);
  var g=40*k;vp.style.backgroundSize=g+"px "+g+"px";vp.style.backgroundPosition=tx+"px "+ty+"px";}
function dims(){return mode==="tree"?bounds:mode==="map"?{w:MW+40,h:MH+40}:tlBounds}
function fit(){var r=vp.getBoundingClientRect(),b=dims();if(mode==="timeline"){k=Math.max(0.35,Math.min(1,(r.height-20)/b.h));tx=b.w*k<r.width?(r.width-b.w*k)/2:0;ty=8;apply();return;}k=Math.min(r.width/b.w,r.height/b.h,mode==="tree"?1.2:3);k=Math.max(k,0.15);tx=(r.width-b.w*k)/2+(mode==="map"?20*k:0);ty=Math.max(8,(r.height-b.h*k)/2)+(mode==="map"?20*k:0);apply();}
function zoomAt(f,cx,cy){var nk=Math.min(mode==="map"?40:3,Math.max(0.15,k*f));f=nk/k;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;k=nk;apply();}
function center(){var r=vp.getBoundingClientRect();return [r.width/2,r.height/2]}
function focusAt(x,y,minK){var r=vp.getBoundingClientRect();var wide=r.width>640;
  var cx=wide?(r.width-Math.min(380,r.width))/2:r.width/2,cy=wide?r.height/2:r.height*0.2;
  if(k<minK)k=minK;tx=cx-x*k;ty=cy-y*k;apply();}
function focusItem(id){if(mode==="timeline"){var t=tlPos[id];if(t)focusAt(t.cx,t.cy,0.8);return;}if(mode==="tree"){var p=pos[id];if(p)focusAt(p.x+W/2,p.y+40,0.9);}else{var q=pinAll().find(function(x){return x.id===id});if(q)focusAt(q.x,q.y,Math.max(k,1.5));}}

function setMode(m){if(m===mode)return;views[mode]={tx:tx,ty:ty,k:k};closePanel(true);placing=false;vp.classList.remove("placing");
  mode=m;["tree","map","timeline"].forEach(function(x){document.body.classList.toggle("mode-"+x,m===x)});
  document.getElementById("mt").setAttribute("aria-pressed",m==="tree");document.getElementById("mm").setAttribute("aria-pressed",m==="map");document.getElementById("ml").setAttribute("aria-pressed",m==="timeline");
  hint.textContent=HINTS[m];setRain(m==="map");document.getElementById("addpin").textContent="Add a pin";render();
  if(views[m]){tx=views[m].tx;ty=views[m].ty;k=views[m].k;apply();}else fit();}
document.getElementById("mt").onclick=function(){setMode("tree")};
document.getElementById("mm").onclick=function(){setMode("map")};
document.getElementById("ml").onclick=function(){setMode("timeline")};
document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var f=c.dataset.f;filt[f]=!filt[f];c.setAttribute("aria-pressed",filt[f]);renderMap();}});
document.getElementById("addpin").onclick=function(){placing=!placing;vp.classList.toggle("placing",placing);this.textContent=placing?"Cancel":"Add a pin";hint.textContent=placing?"Tap the map where the new pin goes.":HINTS.map;};

var ptrs=new Map(),moved=0,startDist=0,startK=1,downTarget=null,downPt=null;
vp.addEventListener("pointerdown",function(e){if(e.target.closest("#panel"))return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downTarget=e.target.closest(".node,.pin,.tlb,.tle");downPt={x:e.clientX,y:e.clientY};
  if(ptrs.size===2){var v=[...ptrs.values()];startDist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);startK=k;}vp.classList.add("drag");});
vp.addEventListener("pointermove",function(e){if(!ptrs.has(e.pointerId))return;var prev=ptrs.get(e.pointerId);var dx=e.clientX-prev.x,dy=e.clientY-prev.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved+=Math.abs(dx)+Math.abs(dy);
  var r=vp.getBoundingClientRect();
  if(ptrs.size===1){tx+=dx;ty+=dy;apply();}
  else if(ptrs.size===2){var v=[...ptrs.values()];var dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);var mx=(v[0].x+v[1].x)/2-r.left,my=(v[0].y+v[1].y)/2-r.top;
    if(startDist>0){zoomAt((startK*dist/startDist)/k,mx,my);}tx+=dx/2;ty+=dy/2;apply();}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)startDist=0;
  if(!ptrs.size){vp.classList.remove("drag");if(moved<8){
    if(mode==="map"&&placing&&downPt&&!e.target.closest(".legend")){var r=vp.getBoundingClientRect();var x=(downPt.x-r.left-tx)/k,y=(downPt.y-r.top-ty)/k;
      x=Math.round(x*10)/10;y=Math.round(y*10)/10;placing=false;vp.classList.remove("placing");document.getElementById("addpin").textContent="Add a pin";hint.textContent=HINTS.map;
      var nid="p"+Date.now().toString(36);state.pins.push({id:nid,x:x,y:y,t:"New pin",s:""});filt.mine=true;document.querySelector('.chip[data-f="mine"]').setAttribute("aria-pressed","true");save("Pin added");open(nid,true);}
    else if(downTarget)open(downTarget.dataset.id);}}}
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("wheel",function(e){if(e.target.closest("#panel"))return;e.preventDefault();var r=vp.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
  if(e.ctrlKey){zoomAt(Math.exp(-e.deltaY*0.01),cx,cy);}
  else if(e.deltaMode===0&&(Math.abs(e.deltaX)>0||Math.abs(e.deltaY)<50)){tx-=e.deltaX;ty-=e.deltaY;apply();}
  else{zoomAt(Math.exp(-Math.sign(e.deltaY)*0.15),cx,cy);}},{passive:false});
vp.addEventListener("keydown",function(e){var n=e.target.closest&&e.target.closest(".node,.pin,.tlb,.tle");if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();open(n.dataset.id);}});
document.getElementById("zi").onclick=function(){var c=center();zoomAt(1.25,c[0],c[1])};
document.getElementById("zo").onclick=function(){var c=center();zoomAt(0.8,c[0],c[1])};
document.getElementById("fit").onclick=fit;
document.getElementById("lin").onclick=function(){showLin=!showLin;this.setAttribute("aria-pressed",showLin);this.textContent=showLin?"Hide lineage":"Show lineage";document.getElementById("lgl").hidden=!showLin;renderTree();};

var CATS={sec:"Secret project site",gov:"Government building",mil:"Military base",uap:"UAP or anomaly site",mine:"Your pin"};
function isTree(id){return treeAll().some(function(x){return x.id===id})}
function isPin(id){return pinAll().some(function(x){return x.id===id})}
function goTo(m,id){if(m==="map"){var p=pinAll().find(function(x){return x.id===id});if(p&&!visible(p)){var f=p.c;filt[f]=true;var ch=document.querySelector('.chip[data-f="'+f+'"]');if(ch)ch.setAttribute("aria-pressed","true");}}setMode(m);open(id);}
function open(id,editName){
  var tl=TLById[id];var n=tl?(tl.own?tl:findItem(tl.pid&&!tl.tid?tl.pid:(tl.type==="ev"&&tl.pid?tl.pid:tl.tid))):findItem(id);if(!n)return;
  var cid=n.id,rel=tl||TLById[TLByTid[cid]]||TLById[TLByPid[cid]]||null;
  var TP={cia:"m-cia",odni:"m-odni",dia:"m-dia",nasa:"m-nasahq",depsec:"m-pentagon",dod:"m-pentagon",congress:"m-capitol",oversight:"m-capitol",pres:"m-whitehouse",usdis:"m-pentagon",jcs:"m-pentagon"},PT={};for(var q in TP)if(!PT[TP[q]])PT[TP[q]]=q;
  var treeId=isTree(cid)?cid:(PT[cid]&&!tl?PT[cid]:(rel&&rel.tid)||PT[cid]||null),pinId=isPin(cid)?cid:(TP[cid]&&!tl?TP[cid]:(rel&&!(rel.own&&!tl)&&rel.pid)||TP[cid]||null),tlId=rel?rel.id:null;
  selId=mode==="tree"?treeId:mode==="map"?pinId:tlId;render();
  var links='';
  if(treeId&&mode!=="tree")links+='<button data-go="tree" data-id="'+treeId+'">Show in family tree</button>';
  if(pinId&&mode!=="map")links+='<button data-go="map" data-id="'+pinId+'">Show on map</button>';
  if(tlId&&mode!=="timeline")links+='<button data-go="timeline" data-id="'+tlId+'">Show on timeline</button>';
  if(links)links='<div class="row golinks">'+links+'</div>';
  id=cid;
  var pill="";
  if(n.st)pill='<span class="pill'+(n.k==="active"?" a":"")+'">'+esc(n.st)+'</span> ';
  if(n.v)pill+='<span class="pill vv">'+esc(n.v)+'</span> ';
  if(n.c)pill+='<span class="pill'+(n.c==="uap"?" a":"")+'">'+CATS[n.c]+'</span> '+(n.u?'<span class="pill a">UAP history</span>':'');
  if(n.custom==="tree")pill+='<span class="pill">Added by you</span>';
  var d=Array.isArray(n.d)?n.d:[n.d];
  var edit=n.custom?'<h3>Name and description</h3><input id="en" maxlength="60" value="'+esc(n.t)+'" aria-label="Name"><input id="es" maxlength="60" style="margin-top:8px" value="'+esc(n.s||"")+'" placeholder="Short description (optional)" aria-label="Description"><div class="err" id="ee"></div><div class="row"><button id="eb">Save name</button></div>':'';
  var branch=n.custom==="pin"||n.c?'':'<h3>Add a branch under this box</h3><input id="cn" placeholder="Name, such as Senate Intelligence Committee" maxlength="60"><input id="cs" placeholder="Short description (optional)" maxlength="60" style="margin-top:8px"><div class="err" id="ce"></div><div class="row"><button id="ca">Add branch</button></div>';
  panel.innerHTML='<div class="ph"><div style="flex:1"><h2>'+esc(n.t)+'</h2>'+(n.s?'<p>'+esc(n.s)+'</p>':'')+'</div><button class="sq" id="pc" aria-label="Close details">&times;</button></div>'+
  '<div class="pb">'+pill+links+'<div class="facts" style="margin-top:6px">'+d.filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+'</div>'+edit+
  '<h3>Your notes</h3><textarea id="nt" placeholder="Add sources, names, dates, or your own research">'+esc(state.notes[id]||"")+'</textarea>'+
  '<div class="row"><button class="primary" id="ns">Save notes</button><span class="status" id="sm" aria-live="polite"></span></div>'+branch+
  (n.custom?'<div class="row" style="margin-top:18px"><button class="danger" id="cd">'+(n.custom==="pin"?"Remove this pin":"Remove this box")+'</button></div>':'')+'</div>';
  panel.classList.add("open");
  panel.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){goTo(b.dataset.go,b.dataset.id)}});
  document.getElementById("pc").onclick=function(){closePanel()};
  document.getElementById("ns").onclick=function(){var v=document.getElementById("nt").value.trim();if(v)state.notes[id]=v;else delete state.notes[id];save("Notes saved");render();};
  var eb=document.getElementById("eb");
  if(eb){var en=document.getElementById("en");en.oninput=function(){document.getElementById("ee").textContent=""};
    eb.onclick=function(){var t=en.value.trim();if(!t){document.getElementById("ee").textContent="Enter a name first";en.focus();return;}
      var arr=n.custom==="pin"?state.pins:state.custom;var rec=arr.find(function(x){return x.id===id});rec.t=t;rec.s=document.getElementById("es").value.trim();save("Name saved");open(id);};
    if(editName){en.focus();en.select();}}
  var ca=document.getElementById("ca");
  if(ca){var cn=document.getElementById("cn");cn.oninput=function(){document.getElementById("ce").textContent=""};
    ca.onclick=function(){var t=cn.value.trim();if(!t){document.getElementById("ce").textContent="Enter a name first";cn.focus();return;}
      var nid="c"+Date.now().toString(36);state.custom.push({id:nid,p:id,t:t,s:document.getElementById("cs").value.trim()});save("Branch added");open(nid);};}
  var cd=document.getElementById("cd");
  if(cd)cd.onclick=function(){
    if(n.custom==="pin"){state.pins=state.pins.filter(function(p){return p.id!==id});delete state.notes[id];}
    else{var rm={};rm[id]=1;var ch=true;while(ch){ch=false;state.custom.forEach(function(c){if(rm[c.p]&&!rm[c.id]){rm[c.id]=1;ch=true}})}
      state.custom=state.custom.filter(function(c){return !rm[c.id]});Object.keys(rm).forEach(function(r){delete state.notes[r]});}
    save("Removed");closePanel();};
  if(selId)focusItem(selId);
}
function closePanel(silent){panel.classList.remove("open");selId=null;if(!silent)render();}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(placing){document.getElementById("addpin").click();}else if(panel.classList.contains("open"))closePanel();}});

function msg(t){var m=document.getElementById("sm");if(m)m.textContent=t;}
function buildDoc(){
  var css=document.getElementById("css").textContent,app=document.getElementById("app").textContent,md=document.getElementById("mapdata").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var S="scr"+"ipt";
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>UAP offices in the U.S. government</title>\n'+
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
  '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">\n'+
  '<style id="css">'+css+'</style>\n</head>\n<body>\n<'+S+' id="state" type="application/json">'+json+'</'+S+'>\n<'+S+' id="mapdata" type="application/json">'+md.replace(/</g,"\\u003c")+'</'+S+'>\n<'+S+' id="app">'+app+'</'+S+'>\n</body>\n</html>\n';
}
function save(okText){
  state.rev=(state.rev||0)+1;
  try{localStorage.setItem("uap-tree-local",JSON.stringify(state))}catch(e){}
  try{sessionStorage.setItem("uap-mode",mode)}catch(e){}
  if(!artifactNS||readOnly){msg(readOnly?"Saved on this device. The shared page is view-only for you.":"Saved on this device");return;}
  msg("Saving…");
  artifactNS.publish(buildDoc()).then(function(){msg(okText)}).catch(function(err){
    var c=err&&err.code;
    if(c==="conflict"){msg("Someone else just updated this page. Reloading to their version.");return;}
    if(c==="not_writer"||c==="not_granted"){readOnly=true;msg("Saved on this device. The shared page is view-only for you.");return;}
    msg("Saved on this device. The shared copy didn't update, so try again in a moment.");
  });
}

vp.addEventListener("scroll",function(){if(vp.scrollLeft||vp.scrollTop){vp.scrollLeft=0;vp.scrollTop=0;}});buildTL();layoutTL();document.body.classList.add("mode-tree");hint.textContent=HINTS.tree;
renderTree();requestAnimationFrame(function(){fit();var m=null;try{m=sessionStorage.getItem("uap-mode")}catch(e){}if(m==="map"||m==="timeline")setMode(m);});
window.addEventListener("resize",function(){if(rainOn)rainSize();if(!panel.classList.contains("open"))fit();});
})();
